<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-labelledby="t d">
  <title id="t">How a run works</title>
  <desc id="d">Judges seal criteria, teams propose alone, clash, build, red-team, pitch and get judged, then a rematch, and lessons feed the next run.</desc>
  <style>
    .bg { fill: #15100D; }
    .pill { fill: #1F1814; stroke: #3A2F28; stroke-width: 1.5; }
    .lit { fill: #D9A066; opacity: 0; animation: lit 7s infinite; }
    @keyframes lit { 0% { opacity: 0; } 3%, 12% { opacity: 1; } 16%, 100% { opacity: 0; } }
    .label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #F2EBE5; }
    .who { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 1px; fill: #A99B91; }
    .num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #A99B91; }
    .arrow { stroke: #3A2F28; stroke-width: 2; fill: none; }
    .loop { stroke: #E4687A; stroke-width: 2; fill: none; stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    .loopText { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1px; fill: #E4687A; }
    @media (prefers-reduced-motion: reduce) { .lit, .loop { animation: none; } }
  </style>
  <rect class="bg" width="1200" height="210" rx="20"/>

  <!-- seven steps, 150 wide, 22 apart, starting at x=32; each lights for 1s of the 7s loop -->
  <g transform="translate(32 40)">
    <rect class="pill" width="150" height="84" rx="12"/><rect class="lit" width="150" height="4" rx="2" style="animation-delay:0s"/>
    <text x="14" y="26" class="num">01</text><text x="14" y="50" class="label">Judges seal</text><text x="14" y="70" class="who">OPUS · SONNET · HAIKU</text>
  </g>
  <g transform="translate(204 40)">
    <rect class="pill" width="150" height="84" rx="12"/><rect class="lit" width="150" height="4" rx="2" style="animation-delay:1s"/>
    <text x="14" y="26" class="num">02</text><text x="14" y="50" class="label">Propose alone</text><text x="14" y="70" class="who">EVERY MEMBER</text>
  </g>
  <g transform="translate(376 40)">
    <rect class="pill" width="150" height="84" rx="12"/><rect class="lit" width="150" height="4" rx="2" style="animation-delay:2s"/>
    <text x="14" y="26" class="num">03</text><text x="14" y="50" class="label">Clash</text><text x="14" y="70" class="who">SKEPTIC ATTACKS</text>
  </g>
  <g transform="translate(548 40)">
    <rect class="pill" width="150" height="84" rx="12"/><rect class="lit" width="150" height="4" rx="2" style="animation-delay:3s"/>
    <text x="14" y="26" class="num">04</text><text x="14" y="50" class="label">Decide + build</text><text x="14" y="70" class="who">PRODUCER · CRAFT</text>
  </g>
  <g transform="translate(720 40)">
    <rect class="pill" width="150" height="84" rx="12"/><rect class="lit" width="150" height="4" rx="2" style="animation-delay:4s"/>
    <text x="14" y="26" class="num">05</text><text x="14" y="50" class="label">Red team</text><text x="14" y="70" class="who">FIX OR DEFEND</text>
  </g>
  <g transform="translate(892 40)">
    <rect class="pill" width="150" height="84" rx="12"/><rect class="lit" width="150" height="4" rx="2" style="animation-delay:5s"/>
    <text x="14" y="26" class="num">06</text><text x="14" y="50" class="label">Pitch + judging</text><text x="14" y="70" class="who">SEALS OPENED</text>
  </g>
  <g transform="translate(1064 40)">
    <rect class="pill" width="104" height="84" rx="12"/><rect class="lit" width="104" height="4" rx="2" style="animation-delay:6s"/>
    <text x="14" y="26" class="num">07</text><text x="14" y="50" class="label">Rematch</text><text x="14" y="70" class="who">V1 VS V2</text>
  </g>

  <!-- the loop back: lessons feed the next run -->
  <path class="loop" d="M1116 128 V160 Q1116 172 1104 172 H96 Q84 172 84 160 V128"/>
  <text x="600" y="194" text-anchor="middle" class="loopText">LESSONS.MD FEEDS THE NEXT RUN</text>
</svg>
