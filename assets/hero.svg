<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Group Project</title>
  <desc id="d">You have something to get done. Run a hackathon: it spins up groups, each group builds its own version, judges grade them, and you get ranked ideas.</desc>
  <style>
    .bg { fill: #15100D; }
    .card { fill: #1F1814; stroke: #3A2F28; stroke-width: 1.5; }
    .ink { fill: #F2EBE5; }
    .muted { fill: #A99B91; }
    .crema { fill: #D9A066; }
    .cherry { fill: #E4687A; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
    .eyebrow { font-size: 14px; letter-spacing: 2px; }
    .lead { font-size: 26px; font-weight: 700; }
    .sub { font-size: 19px; }
    .name { font-size: 15px; font-weight: 700; }
    .tag { font-size: 11px; letter-spacing: 1.5px; }
    .rank { font-size: 15px; font-weight: 700; }

    /* 9s story, one beat at a time:
       brief 0-12% · spin up groups 10-22% · build 20-52% · judges grade 52-72% · ideas 72-94% · reset */
    .brief { animation: brief 9s infinite; }
    @keyframes brief { 0% { opacity: .35; } 6%, 94% { opacity: 1; } 100% { opacity: .35; } }
    .spawn { stroke: #D9A066; stroke-width: 2; fill: none; stroke-dasharray: 1; animation: spawn 9s infinite; }
    @keyframes spawn { 0%, 8% { stroke-dashoffset: 1; opacity: 1; } 18%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .group { animation: group 9s infinite; }
    @keyframes group { 0%, 12% { opacity: .25; } 20%, 94% { opacity: 1; } 100% { opacity: .25; } }
    .dot { animation: talk 9s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes talk { 0%, 20% { opacity: .35; transform: scale(1); } 23% { opacity: 1; transform: scale(1.5); } 27%, 100% { opacity: .35; transform: scale(1); } }
    .bar { animation: build 9s infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes build { 0%, 22% { transform: scaleX(0); } 52%, 94% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .grade { stroke: #D9A066; stroke-width: 2; fill: none; stroke-dasharray: 5 6; animation: grade 9s infinite; }
    @keyframes grade { 0%, 50% { opacity: 0; } 56%, 70% { opacity: 1; } 76%, 100% { opacity: 0; } }
    .judge { animation: judge 9s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes judge { 0%, 55% { opacity: .35; transform: scale(1); } 61% { opacity: 1; transform: scale(1.15); } 66%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: .35; } }
    .idea { opacity: 0; animation: idea 9s infinite; }
    @keyframes idea { 0%, 72% { opacity: 0; } 78%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .brief, .spawn, .group, .dot, .bar, .grade, .judge, .idea { animation: none; }
      .bar { transform: scaleX(1); }
      .idea { opacity: 1; }
    }
  </style>

  <rect class="bg" width="1200" height="440" rx="20"/>

  <!-- Left: the pitch -->
  <text x="56" y="96" class="mono eyebrow crema">CLAUDE CODE SKILL</text>
  <text x="52" y="164" class="sans title ink">Group Project</text>
  <text x="56" y="222" class="sans lead ink">Need ideas? Run a hackathon.</text>
  <text x="56" y="262" class="sans sub muted">It spins up groups of agents.</text>
  <text x="56" y="290" class="sans sub muted">Each group builds its own take.</text>
  <text x="56" y="318" class="sans sub muted">Judges grade every one.</text>
  <text x="56" y="346" class="sans sub muted">You get ranked, finished ideas.</text>

  <!-- 1. The brief -->
  <g class="brief">
    <rect class="card" x="770" y="26" width="240" height="44" rx="22"/>
    <text x="890" y="53" text-anchor="middle" class="sans name ink">Something you need done</text>
  </g>

  <!-- 2. Spin up groups -->
  <path class="spawn" pathLength="1" d="M890 70 V84 Q890 92 882 92 H730 Q722 92 722 100 V108"/>
  <path class="spawn" pathLength="1" d="M890 70 V108"/>
  <path class="spawn" pathLength="1" d="M890 70 V84 Q890 92 898 92 H1050 Q1058 92 1058 100 V108"/>

  <!-- 3. Each group builds its own take -->
  <g class="group">
    <g transform="translate(652 108)">
      <rect class="card" width="140" height="104" rx="12"/>
      <text x="16" y="28" class="sans name ink">Group A</text>
      <circle class="dot crema" cx="40" cy="56" r="6"/>
      <circle class="dot cherry" cx="62" cy="56" r="6" style="animation-delay:-8.7s"/>
      <circle class="dot ink" cx="84" cy="56" r="6" style="animation-delay:-8.4s"/>
      <circle class="dot muted" cx="106" cy="56" r="6" style="animation-delay:-8.1s"/>
      <rect x="16" y="82" width="108" height="6" rx="3" fill="#3A2F28"/>
      <rect class="bar crema" x="16" y="82" width="108" height="6" rx="3"/>
    </g>
    <g transform="translate(820 108)">
      <rect class="card" width="140" height="104" rx="12"/>
      <text x="16" y="28" class="sans name ink">Group B</text>
      <circle class="dot crema" cx="40" cy="56" r="6" style="animation-delay:-0.45s"/>
      <circle class="dot cherry" cx="62" cy="56" r="6" style="animation-delay:-0.15s"/>
      <circle class="dot ink" cx="84" cy="56" r="6" style="animation-delay:-8.85s"/>
      <circle class="dot muted" cx="106" cy="56" r="6" style="animation-delay:-8.55s"/>
      <rect x="16" y="82" width="108" height="6" rx="3" fill="#3A2F28"/>
      <rect class="bar crema" x="16" y="82" width="108" height="6" rx="3"/>
    </g>
    <g transform="translate(988 108)">
      <rect class="card" width="140" height="104" rx="12"/>
      <text x="16" y="28" class="sans name ink">Group C</text>
      <circle class="dot crema" cx="40" cy="56" r="6" style="animation-delay:-0.9s"/>
      <circle class="dot cherry" cx="62" cy="56" r="6" style="animation-delay:-0.6s"/>
      <circle class="dot ink" cx="84" cy="56" r="6" style="animation-delay:-0.3s"/>
      <circle class="dot muted" cx="106" cy="56" r="6" style="animation-delay:-9s"/>
      <rect x="16" y="82" width="108" height="6" rx="3" fill="#3A2F28"/>
      <rect class="bar crema" x="16" y="82" width="108" height="6" rx="3"/>
    </g>
  </g>

  <!-- 4. Judges grade every one -->
  <path class="grade" d="M722 212 V236"/>
  <path class="grade" d="M890 212 V236"/>
  <path class="grade" d="M1058 212 V236"/>
  <rect class="card" x="652" y="236" width="476" height="68" rx="12"/>
  <text x="668" y="262" class="mono tag muted">JUDGES</text>
  <circle class="judge ink" cx="790" cy="270" r="16"/>
  <circle class="judge ink" cx="858" cy="270" r="16" style="animation-delay:-8.85s"/>
  <circle class="judge ink" cx="926" cy="270" r="13" style="animation-delay:-8.7s"/>
  <circle class="judge ink" cx="994" cy="270" r="13" style="animation-delay:-8.55s"/>
  <circle class="judge ink" cx="1062" cy="270" r="10" style="animation-delay:-8.4s"/>

  <!-- 5. You get ranked ideas -->
  <text x="668" y="340" class="mono tag muted">YOUR IDEAS, RANKED</text>
  <g class="idea">
    <rect x="652" y="352" width="140" height="44" rx="10" fill="#D9A066"/>
    <text x="722" y="380" text-anchor="middle" class="sans rank" fill="#15100D">1st · Group B</text>
  </g>
  <g class="idea" style="animation-delay:-8.82s">
    <rect class="card" x="820" y="352" width="140" height="44" rx="10"/>
    <text x="890" y="380" text-anchor="middle" class="sans rank ink">2nd · Group A</text>
  </g>
  <g class="idea" style="animation-delay:-8.64s">
    <rect class="card" x="988" y="352" width="140" height="44" rx="10"/>
    <text x="1058" y="380" text-anchor="middle" class="sans rank ink">3rd · Group C</text>
  </g>
</svg>
