<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found - Crumb &amp; Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--flour:#faf5ec;--crust:#5a3a22;--cream:#f3e3c3;--rust:#b3401f}
*{box-sizing:border-box}
body{margin:0;background:var(--flour);color:var(--crust);font:18px/1.5 Georgia,serif}
main{max-width:640px;margin:0 auto;padding:16px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;margin:0 0 16px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(32px,9vw,52px);line-height:1.05;margin:0 0 8px}
.stamp{display:inline-block;color:var(--rust);border:3px solid var(--rust);border-radius:6px;padding:0 8px;font-size:.5em;vertical-align:middle;transform:rotate(-4deg);margin-right:8px}
.lead{margin:0 0 12px}
nav{display:grid;gap:10px;margin:16px 0}
nav a{display:flex;flex-direction:column;justify-content:center;min-height:56px;padding:10px 16px;background:var(--crust);color:var(--cream);text-decoration:none;border-radius:10px;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;line-height:1.2}
nav a small{display:block;font:16px/1.3 Georgia,serif;opacity:.9}
nav a:focus-visible,nav a:hover{outline:3px solid var(--rust);outline-offset:2px}
svg{display:block;width:100%;height:auto;margin:8px 0}
.slash{fill:none;stroke:var(--cream);stroke-width:5;stroke-linecap:round;animation:fade 1.2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.slash{animation:none}}
.ask{margin:0 0 12px}
code{font-family:"DM Mono",ui-monospace,monospace;overflow-wrap:anywhere;word-break:break-all;background:var(--cream);padding:1px 6px;border-radius:4px;font-size:16px}
.status{font-weight:bold;margin:0 0 12px}
.hours{margin:0;font-size:16px}
</style></head><body><main>
<p class="brand">Crumb &amp; Co.</p>
<h1><span class="stamp">404</span>Page not found</h1>
<p class="lead">That page has sold out. Nothing in the oven at this address.</p>
<p class="status" id="status">Open 7am-2pm, closed Mondays.</p>
<nav>
<a href="/">Home</a>
<a href="/menu">Menu</a>
<a href="#status">Hours<small>7am-2pm, closed Mondays</small></a>
</nav>
<svg viewBox="0 0 400 210" aria-hidden="true">
<defs><path id="arc" d="M80 112 Q200 62 320 112"/></defs>
<ellipse cx="200" cy="120" rx="185" ry="82" fill="#5a3a22"/>
<ellipse cx="200" cy="108" rx="170" ry="68" fill="#7a4e2c" opacity=".55"/>
<path class="slash" d="M60 120 Q75 90 95 80"/>
<path class="slash" d="M305 80 Q325 90 340 120"/>
<path class="slash" d="M110 150 Q125 128 145 122"/>
<path class="slash" d="M255 122 Q275 128 290 150"/>
<path class="slash" d="M150 168 Q200 182 250 168"/>
<text id="word" fill="#f3e3c3" font-family="'DM Mono',ui-monospace,monospace" font-weight="bold" text-anchor="middle" font-size="40"><textPath href="#arc" startOffset="50%" id="tp">?</textPath></text>
</svg>
<p class="ask">You asked for: <code id="path">/</code></p>
</main>
<script>
(function(){
var p=location.pathname||"/";
try{p=decodeURIComponent(p)}catch(e){}
document.getElementById("path").textContent=p;
var segs=p.split("/").filter(Boolean),w=(segs[segs.length-1]||"").toUpperCase();
if(w.length>12)w=w.slice(0,12)+"…";
if(!w||/[^\x20-\x7E -￿]/.test(w))w="?";
document.getElementById("tp").textContent=w;
document.getElementById("word").setAttribute("font-size",Math.max(22,Math.min(44,Math.floor(250/Math.max(w.length,1)*1.4))));
var d=new Date(),day=d.getDay(),h=d.getHours()+d.getMinutes()/60,s;
if(day===1)s="Closed Mondays, back Tuesday 7am.";
else if(h<7)s="Opens 7am today.";
else if(h<14)s="Open now, until 2pm.";
else s=day===0?"Closed for today, closed Monday, back Tuesday 7am.":"Closed for today, back tomorrow 7am.";
document.getElementById("status").textContent=s;
})();
</script></body></html>
