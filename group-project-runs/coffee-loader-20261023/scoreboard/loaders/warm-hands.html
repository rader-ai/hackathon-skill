<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Pour, by Hand - coffee loader</title>
<style>
:root {
  --paper:#F6EBDD; --glaze:#FBF5EC; --espresso:#2B1A12; --crema:#E9C9A0;
  --sienna:#B5532B; --roast:#7A4527;
  --cycle:5s; --ease:cubic-bezier(.45,.05,.35,.95);
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--paper); color:var(--espresso); font:14px/1.4 system-ui,sans-serif; display:flex; min-height:100vh; }
.pane { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
.small { flex:0 0 200px; }
.big { flex:1 1 0; min-width:0; height:100vh; }
.big .label { margin-bottom:56px; }
@media (max-width:560px) { .small { position:absolute; top:0; left:0; z-index:1; flex:none; width:auto; } .big { flex:1 1 100%; } }
.box { width:120px; height:120px; }
.big .loader { width:min(80vh,100%); height:auto; }
.loader { display:block; width:100%; height:100%; overflow:visible; }
.label { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--roast); }
.ctl { position:fixed; right:12px; bottom:12px; display:flex; gap:8px; align-items:center; font-size:12px; background:var(--glaze); border:1px solid var(--roast); border-radius:8px; padding:6px 10px; }
.ctl button { font:inherit; color:inherit; background:none; border:1px solid var(--roast); border-radius:6px; padding:2px 8px; cursor:pointer; }

/* the component: transform and opacity only, everything periodic over --cycle */
.rim { fill:var(--glaze); stroke:var(--roast); stroke-width:1.5; }
.handle { fill:none; stroke:var(--roast); stroke-width:8; stroke-linecap:round; }
.handle-in { fill:none; stroke:var(--glaze); stroke-width:4.5; stroke-linecap:round; }
.coffee { fill:var(--espresso); }
.bloom { fill:var(--roast); opacity:.55; will-change:opacity; animation:bloom var(--cycle) ease-in-out infinite; }
.sweep { will-change:transform; animation:sweep var(--cycle) linear infinite; }
.sway { animation:sway var(--cycle) var(--ease) infinite; }
.pour { fill:none; stroke:var(--crema); stroke-width:5; stroke-linecap:round; }
.tail { stroke:var(--sienna); }
.stain { fill:none; stroke:var(--roast); stroke-width:2.6; stroke-linecap:round; opacity:.7; animation:stain var(--cycle) ease-in-out infinite; animation-delay:calc(var(--cycle) / -2); }
.tip { fill:var(--sienna); }
.smudge { fill:var(--sienna); opacity:.3; }

@keyframes sweep { to { transform:rotate(360deg); } }
@keyframes sway { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(8deg); } }
@keyframes bloom { 0%,100% { opacity:.55; } 50% { opacity:.95; } }
@keyframes stain { 0%,100% { opacity:.7; } 50% { opacity:1; } }
.restart * { animation:none !important; }

/* reduced motion: a held pour (spiral at rest) with a slow breathing surface */
@media (prefers-reduced-motion:reduce) {
  .sweep, .sway { animation:none; will-change:auto; }
  .sweep { transform:rotate(-20deg); }
  .sway { transform:none; }
  .bloom, .stain { animation-name:calm; }
}
/* same rules behind the preview toggle (keep in sync with the media block above) */
html.rm .sweep, html.rm .sway { animation:none; will-change:auto; }
html.rm .sweep { transform:rotate(-20deg); }
html.rm .sway { transform:none; }
html.rm .bloom, html.rm .stain { animation-name:calm; }
@keyframes calm { 0%,100% { opacity:.7; } 50% { opacity:1; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pour" viewBox="0 0 120 120">
    <path class="handle" d="M96 50C112 48 114 72 96 72"/>
    <path class="handle-in" d="M96 50C112 48 114 72 96 72"/>
    <path class="rim" d="M54.0 13.4C61.6 13.4 70.0 16.7 76.8 20.5C83.6 24.4 90.7 30.0 94.6 36.5C98.5 43.1 100.4 52.3 100.2 60.0C100.0 67.7 97.1 75.9 93.2 82.6C89.4 89.4 83.8 96.4 77.2 100.3C70.7 104.1 61.8 105.8 54.0 105.8C46.2 105.8 37.2 104.4 30.6 100.5C24.0 96.7 18.4 89.5 14.6 82.8C10.8 76.0 7.9 67.7 7.7 60.0C7.5 52.3 9.6 43.2 13.6 36.6C17.5 30.1 24.6 24.6 31.3 20.7C38.0 16.8 46.4 13.4 54.0 13.4Z"/>
    <circle class="coffee" cx="54" cy="60" r="38"/>
    <circle class="bloom" cx="54" cy="60" r="31"/>
    <g transform="translate(54 60)"><g class="sweep"><g class="sway"><g transform="translate(-54 -60)">
      <path class="pour" d="M54.0 57.0C54.6 56.9 56.5 55.7 57.8 56.2C59.1 56.7 61.2 58.2 61.7 60.0C62.3 61.8 62.4 65.1 61.1 67.1C59.8 69.2 56.9 71.9 54.0 72.4C51.1 73.0 46.4 72.5 43.5 70.5C40.7 68.4 37.4 64.0 36.9 60.0C36.3 56.0 37.4 49.9 40.2 46.2C43.1 42.6 48.8 38.7 54.0 38.1C59.2 37.6 66.7 39.2 71.1 42.9C75.6 46.5 80.0 53.7 80.6 60.0C81.1 66.3 78.9 75.2 74.5 80.5C70.0 85.7 61.4 90.7 54.0 91.3C46.6 91.8 36.2 89.0 30.2 83.8C24.2 78.6 20.0 64.0 18.0 60.0"/>
      <circle class="tip" cx="18" cy="60" r="4.5"/>
      <path class="pour tail" d="M54.0 57.0C54.6 56.9 56.4 55.7 57.6 56.2C58.9 56.6 60.9 57.8 61.5 59.5C62.2 61.2 62.5 64.2 61.5 66.2C60.5 68.3 58.2 71.1 55.5 72.0C52.9 72.8 47.2 71.6 45.6 71.6"/>
    </g></g></g></g>
    <path class="stain" d="M40.1 99.4C37.5 97.8 28.8 93.8 24.6 89.6C20.4 85.4 16.8 79.7 14.8 74.1C12.7 68.5 11.8 61.9 12.4 55.9C12.9 50.0 17.0 41.3 17.9 38.4M26.2 28.1C27.1 27.4 29.5 25.4 31.2 24.2C32.9 23.1 34.8 22.1 36.7 21.2C38.6 20.3 40.6 19.5 42.6 18.9C44.6 18.4 47.7 17.8 48.7 17.6M67.7 19.3C68.9 19.8 72.8 21.2 75.2 22.5C77.5 23.8 79.8 25.4 81.9 27.1C83.9 28.9 85.9 30.8 87.6 32.9C89.2 35.0 91.3 38.6 92.0 39.7"/>
    <ellipse class="smudge" cx="29" cy="27" rx="4.5" ry="2.8" transform="rotate(-35 29 27)"/>
  </symbol>
</svg>

<div class="pane small">
  <div class="box"><svg class="loader" viewBox="0 0 120 120" role="img" aria-label="Loading: your coffee is being made"><use href="#pour"/></svg></div>
  <div class="label">120 &times; 120</div>
</div>
<div class="pane big">
  <svg class="loader" viewBox="0 0 120 120" aria-hidden="true"><use href="#pour"/></svg>
  <div class="label">Splash</div>
</div>

<div class="ctl">
  <label><input type="checkbox" id="rm"> reduced motion</label>
  <button id="replay" type="button">Replay</button>
</div>
<script>
const h=document.documentElement;
document.getElementById("rm").onchange=e=>h.classList.toggle("rm",e.target.checked);
document.getElementById("replay").onclick=()=>{h.classList.add("restart");void h.offsetWidth;h.classList.remove("restart");};
</script>
</body>
</html>
