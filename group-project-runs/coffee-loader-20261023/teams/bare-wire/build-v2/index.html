<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bare Wire - Crema Scar Loader</title>
<style>
:root{
  --roast:#2B1810; --scar:#6B4226; --cup:#1B120D; --crema:#C98B4E; --glint:#E8C08F; --paper:#F4EBDD;
  --ease-scar:cubic-bezier(.2,.6,.3,1);
  --ease-swell:cubic-bezier(.45,0,.55,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--roast);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}

/* Layout: the 120px in-app instance beside the splash. Both are the same markup; only the container differs. */
.side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;border-right:1px solid rgba(43,24,16,.15)}
.cap{font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.inst{width:120px;height:120px}
.splash{flex:1;min-width:0;height:100vh;container-type:size;display:flex;align-items:center;justify-content:center}
.splash .loader-wrap{width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
.loader{display:block;width:100%;height:100%}

/* Component: cup, handle, crema field, two scars, one glint. Six shapes, fills only (handle and glint are static strokes). */
.handle{fill:none;stroke:var(--cup);stroke-width:5}
.cup{fill:var(--cup)}
.field{fill:var(--crema);transform-box:fill-box;transform-origin:center;animation:bloom 5s var(--ease-swell) infinite}
.glint{fill:none;stroke:var(--glint);stroke-width:2.2;stroke-linecap:round;opacity:.7;animation:glint 2.5s linear infinite}
/* Two drops per cycle, 2.5s apart. Each opens a dark hole fast, holds it, then the crema closes it slowly. Scar B is scar A, half a cycle later. */
.scar{fill:var(--scar);transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;will-change:transform,opacity;animation:scar 5s linear infinite}
.scarB{animation-delay:-2.5s}

/* 0-6% open (0.3s, ease-out), 6-16% hold (0.5s), 16-50% close (1.7s, ease-in-out). Scale 0 and opacity 0 at 0% and 100%: frame 5.0 = frame 0.0. */
@keyframes scar{
  0%{transform:scale(.05);opacity:0;animation-timing-function:var(--ease-scar)}
  1.5%{opacity:1}
  6%{transform:scale(.55);opacity:1;animation-timing-function:linear}
  16%{transform:scale(.55);opacity:1;animation-timing-function:var(--ease-swell)}
  50%{transform:scale(0);opacity:1}
  50.1%,100%{transform:scale(0);opacity:0}
}
/* Landing cue: glint brightens as each scar opens (t=0 and t=2.5s), then settles. */
@keyframes glint{0%{opacity:.7}6%{opacity:1}30%,100%{opacity:.7}}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes breathe-field{0%,100%{opacity:.88}50%{opacity:1}}
@keyframes breathe-scar{0%,100%{opacity:.35}50%{opacity:1}}

/* Reduced motion: no travel. Scar B is hidden (shorthand would reset its delay and sync it with A), glint is still, one half-closed scar breathes .35 to 1 over 5s, field breathes .88 to 1. */
@media (prefers-reduced-motion: reduce){
  .field{animation:breathe-field 5s var(--ease-swell) infinite}
  .scar{transform:scale(.4);animation:breathe-scar 5s var(--ease-swell) infinite}
  .scarB{display:none}
  .glint{animation:none}
}
/* Same rules for the preview toggle (CSS cannot share a selector list between @media and an attribute). */
:root[data-motion="reduce"] .field{animation:breathe-field 5s var(--ease-swell) infinite}
:root[data-motion="reduce"] .scar{transform:scale(.4);animation:breathe-scar 5s var(--ease-swell) infinite}
:root[data-motion="reduce"] .scarB{display:none}
:root[data-motion="reduce"] .glint{animation:none}

/* Preview controls */
.ctl{display:flex;gap:8px;margin-top:8px}
.ctl button{font:inherit;color:var(--paper);background:var(--roast);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
.ctl button:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
@media (max-width:640px){body{flex-direction:column}.side{border-right:0;border-bottom:1px solid rgba(43,24,16,.15)}.splash{height:70vh}}
</style>
</head>
<body>
  <div class="side">
    <div class="loader-wrap inst" role="img" aria-label="Loading">
      <svg class="loader" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <path class="handle" d="M80 40h6a10 10 0 0 1 0 20h-6"/>
        <circle class="cup" cx="42" cy="50" r="40"/>
        <circle class="field" cx="42" cy="50" r="35"/>
        <circle class="scar" cx="47" cy="54" r="35"/>
        <circle class="scar scarB" cx="36" cy="47" r="35"/>
        <path class="glint" d="M20 40A24 24 0 0 1 34 26"/>
      </svg>
    </div>
    <div class="cap">120 &times; 120</div>
    <p class="cap" style="max-width:20ch;text-align:center;text-transform:none;letter-spacing:0">A drop breaks the crema; the crema closes the hole.</p>
    <div class="ctl">
      <button id="replay" type="button">Replay</button>
      <button id="rm" type="button" aria-pressed="false">Preview reduced motion</button>
    </div>
  </div>
  <div class="splash">
    <!-- Identical to the 120px markup on purpose: inline SVG is pasted, not <use>d, to avoid Safari shadow-tree animation quirks. -->
    <div class="loader-wrap" role="img" aria-label="Loading">
      <svg class="loader" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <path class="handle" d="M80 40h6a10 10 0 0 1 0 20h-6"/>
        <circle class="cup" cx="42" cy="50" r="40"/>
        <circle class="field" cx="42" cy="50" r="35"/>
        <circle class="scar" cx="47" cy="54" r="35"/>
        <circle class="scar scarB" cx="36" cy="47" r="35"/>
        <path class="glint" d="M20 40A24 24 0 0 1 34 26"/>
      </svg>
    </div>
  </div>
<script>
// Controls only: restart the clock, and preview the reduced-motion state. No animation logic here.
document.getElementById('replay').onclick=function(){document.getAnimations().forEach(function(a){a.cancel();a.play()})};
document.getElementById('rm').onclick=function(){
  var r=document.documentElement,on=r.getAttribute('data-motion')!=='reduce';
  if(on)r.setAttribute('data-motion','reduce');else r.removeAttribute('data-motion');
  this.setAttribute('aria-pressed',String(on));
};
</script>
</body>
</html>
