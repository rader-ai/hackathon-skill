<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TICK - coffee loader</title>
<style>
  /* Timing contract: cycle 5s. Drop and ring run on a 1s beat (x5); crema steps, stream and
     breathe run on the 5s clock. Every duration divides 5s. */
  :root {
    --roast: #1B100B;     /* field */
    --cup: #F3E6D2;       /* cup, saucer, spout */
    --crema: #C8873E;     /* the drop, its ring, the pull */
    --crema-lt: #EDC080;  /* the crema layer that counts */
    --coffee: #3A2112;    /* coffee surface under the crema */
    --shade: #5A3720;     /* cup shadow, dashed outline */
    --cycle: 5s;                    /* one full loop */
    --beat: calc(var(--cycle) / 5); /* one drop = 1s */
  }

  /* ---------- page chrome (not part of the loader) ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; background: var(--roast); color: var(--cup); font: 13px/1.4 system-ui, sans-serif; }
  .side { width: 200px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .box { width: 120px; height: 120px; outline: 1px dashed var(--shade); outline-offset: 4px; }
  .splash { flex: 1; min-width: 0; height: 100vh; display: grid; place-items: center; }
  .splash .tick { width: min(100%, 100vh); aspect-ratio: 1; height: auto; }
  .label { opacity: .6; }
  button, label { font: inherit; color: var(--cup); }
  button { background: none; border: 1px solid var(--shade); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    .side { width: auto; padding: 24px 0; }
    .splash { height: 70vh; }
  }

  /* ---------- the loader: one art, used twice ---------- */
  .tick { display: block; width: 100%; height: 100%; }
  .drop, .ring, .crema, .stream { transform-box: fill-box; transform-origin: center; }
  .stream { transform-origin: top; }

  .drop    { animation: drop var(--beat) linear infinite both; }
  .ring    { opacity: 0; animation: ring var(--beat) linear infinite both; }
  .crema   { animation: crema var(--cycle) linear infinite both; }
  .stream  { opacity: 0; transform: scaleY(0); animation: pull var(--cycle) linear infinite both; }
  .surface { animation: breathe var(--cycle) ease-in-out infinite both; }

  /* 1s beat. Fade in at the spout (0-8%), gravity fall to 55%, squash and fade into the ring (55-65%).
     Nothing cuts: opacity is 0 whenever the transform resets. */
  @keyframes drop {
    0%   { opacity: 0; transform: translateY(0) scale(.3); animation-timing-function: ease-out; }
    8%   { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    55%  { opacity: 1; transform: translateY(25px) scale(1); animation-timing-function: ease-out; }
    65%  { opacity: 0; transform: translateY(25px) scale(1.3, .5); }
    100% { opacity: 0; transform: translateY(0) scale(.3); }
  }
  /* the ring opens from nothing as the drop squashes, then fades out wide */
  @keyframes ring {
    0%, 55% { opacity: 0; transform: scale(.3); animation-timing-function: ease-out; }
    65%     { opacity: .9; transform: scale(.55); animation-timing-function: ease-out; }
    90%     { opacity: 0; transform: scale(1); }
    100%    { opacity: 0; transform: scale(.3); }
  }
  /* The count. Each landing (impact at 11/31/51/71/91%) steps the crema up 0.12s (2.4%).
     opacity .10 to .80 and scaleX .62 to .90; the swap at 95-100% is the last "step":
     a fast hand-off back to the start, so frame 5.0 equals frame 0.0 and it never completes. */
  @keyframes crema {
    0%, 11%  { opacity: .10; transform: scaleX(.62); animation-timing-function: ease-out; }
    13.4%, 31% { opacity: .24; transform: scaleX(.69); animation-timing-function: ease-out; }
    33.4%, 51% { opacity: .38; transform: scaleX(.76); animation-timing-function: ease-out; }
    53.4%, 71% { opacity: .52; transform: scaleX(.83); animation-timing-function: ease-out; }
    73.4%, 91% { opacity: .66; transform: scaleX(.90); animation-timing-function: ease-out; }
    93.4%, 95% { opacity: .80; transform: scaleX(.97); animation-timing-function: ease-in-out; }
    100%     { opacity: .10; transform: scaleX(.62); }
  }
  /* the pull: 3.0-3.5s the drop is a short stream (27 units, 2.7x a drop) that thins back out */
  @keyframes pull {
    0%, 60%  { opacity: 0; transform: scaleY(0); animation-timing-function: ease-in; }
    64%      { opacity: 1; transform: scaleY(1); animation-timing-function: linear; }
    67%      { opacity: 1; transform: scaleY(1); animation-timing-function: ease-out; }
    70%, 100% { opacity: 0; transform: scaleY(0); }
  }
  /* stolen from bare-wire: a barely-there breathe, on the surface under the count (not on it) */
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .98; } }

  /* ---------- reduced motion: no movement, only slow fades ---------- */
  @keyframes crema-soft {
    0%, 8%     { opacity: .10; }
    18%, 28%   { opacity: .24; }
    38%, 48%   { opacity: .38; }
    58%, 68%   { opacity: .52; }
    78%, 88%   { opacity: .66; }
    96%, 100%  { opacity: .10; }
  }
  @keyframes calm { 0%, 100% { opacity: .25; } 50% { opacity: .7; } }

  @media (prefers-reduced-motion: reduce) {
    .drop    { animation: none; opacity: 1; transform: translateY(12px); }
    .ring    { animation: calm var(--cycle) ease-in-out infinite; transform: scale(.8); }
    .stream, .surface { animation: none; }
    .crema   { animation: crema-soft var(--cycle) ease-in-out infinite; transform: scaleX(.8); }
  }
  /* same rules, driven by the page toggle (keep in sync with the block above) */
  :root[data-motion="reduce"] .drop    { animation: none; opacity: 1; transform: translateY(12px); }
  :root[data-motion="reduce"] .ring    { animation: calm var(--cycle) ease-in-out infinite; transform: scale(.8); }
  :root[data-motion="reduce"] .stream,
  :root[data-motion="reduce"] .surface { animation: none; }
  :root[data-motion="reduce"] .crema   { animation: crema-soft var(--cycle) ease-in-out infinite; transform: scaleX(.8); }
</style>
</head>
<body>
  <div class="side">
    <div class="box">
<svg class="tick" viewBox="0 -4 120 120" role="img" aria-label="Loading: coffee dripping into a cup, the crema rising one step per drop">
  <ellipse cx="60" cy="98" rx="40" ry="5" fill="var(--cup)"/>
  <path d="M92 64h6a9 9 0 0 1 0 18h-6" fill="none" stroke="var(--cup)" stroke-width="5"/>
  <path d="M28 56H92V78Q92 96 74 96H46Q28 96 28 78Z" fill="var(--cup)"/>
  <path d="M84 56H92V78Q92 94 78 96Q84 88 84 78Z" fill="var(--shade)"/>
  <ellipse class="surface" cx="60" cy="56" rx="32" ry="7" fill="var(--coffee)"/>
  <ellipse class="crema" cx="60" cy="56" rx="29" ry="5.5" fill="var(--crema-lt)"/>
  <rect x="57" y="10" width="6" height="14" fill="var(--cup)"/>
  <path d="M57 24H63L60 29Z" fill="var(--cup)"/>
  <rect class="stream" x="58" y="29" width="4" height="27" rx="2" fill="var(--crema)"/>
  <ellipse class="ring" cx="60" cy="56" rx="24" ry="5" fill="none" stroke="var(--crema)" stroke-width="2.5"/>
  <circle class="drop" cx="60" cy="31" r="5" fill="var(--crema)"/>
</svg>
    </div>
    <div class="label">120px in-app</div>
    <button id="replay" type="button">Replay</button>
    <label><input id="rm" type="checkbox"> Preview reduced motion</label>
  </div>
  <div class="splash" aria-hidden="true">
<svg class="tick" viewBox="0 -4 120 120">
  <ellipse cx="60" cy="98" rx="40" ry="5" fill="var(--cup)"/>
  <path d="M92 64h6a9 9 0 0 1 0 18h-6" fill="none" stroke="var(--cup)" stroke-width="5"/>
  <path d="M28 56H92V78Q92 96 74 96H46Q28 96 28 78Z" fill="var(--cup)"/>
  <path d="M84 56H92V78Q92 94 78 96Q84 88 84 78Z" fill="var(--shade)"/>
  <ellipse class="surface" cx="60" cy="56" rx="32" ry="7" fill="var(--coffee)"/>
  <ellipse class="crema" cx="60" cy="56" rx="29" ry="5.5" fill="var(--crema-lt)"/>
  <rect x="57" y="10" width="6" height="14" fill="var(--cup)"/>
  <path d="M57 24H63L60 29Z" fill="var(--cup)"/>
  <rect class="stream" x="58" y="29" width="4" height="27" rx="2" fill="var(--crema)"/>
  <ellipse class="ring" cx="60" cy="56" rx="24" ry="5" fill="none" stroke="var(--crema)" stroke-width="2.5"/>
  <circle class="drop" cx="60" cy="31" r="5" fill="var(--crema)"/>
</svg>
  </div>
<script>
  // Only two jobs: restart the animations in sync, and preview reduced motion.
  document.getElementById('replay').onclick = function () {
    var els = document.querySelectorAll('.tick *');
    els.forEach(function (e) { e.style.animation = 'none'; });
    document.body.offsetWidth; // force reflow
    els.forEach(function (e) { e.style.animation = ''; });
  };
  document.getElementById('rm').onchange = function (ev) {
    var root = document.documentElement;
    if (ev.target.checked) root.setAttribute('data-motion', 'reduce');
    else root.removeAttribute('data-motion');
  };
</script>
</body>
</html>
